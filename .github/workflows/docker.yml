name: Publish images

# Builds Docker images and pushes them to GHCR (GitHub Container Registry)
# whenever a tag matching v* is pushed. Users can then run
#   docker compose pull && docker compose up -d
# instead of paying the 5-minute first-time `docker compose build`
# (torch + CUDA wheels are bulky).
#
# Trigger:  git tag v0.1.0 && git push --tags
#
# What we DON'T publish:
# - geshtu-worker — same image as geshtu-api, only the compose `command:`
#   differs. Publishing twice would just double our GHCR storage.
# - geshtu-mcp   — distributed via npm (`@geshtu/mcp`). Operators install it
#   through `npx -y @geshtu/mcp`, not as a Docker image.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { context: ./api,   name: geshtu-api }
          - { context: ./admin, name: geshtu-admin }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
