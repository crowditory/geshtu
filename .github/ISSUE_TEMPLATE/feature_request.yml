name: Feature request
description: Suggest a new capability or change to existing behavior.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before filing, please confirm:

        - Geshtu's scope is intentionally narrow. See
          `GOVERNANCE.md` for the four-layer memory model and the
          merge criteria for core changes.
        - Anything that would require a fifth core table is almost
          always better as a separate plugin / extension.
        - Architectural changes (MCP surface, schema) require an
          RFC. See GOVERNANCE.md → RFC process.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the use case in concrete terms. "We want X so that Y"
        is much easier to evaluate than "Geshtu should support X."
      placeholder: |
        When I close a session and reopen it the next day, I have to
        re-read all the facts manually. I would like the digest to be
        scoped to the time since I last opened the project.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        How would you like Geshtu to behave? Describe at the
        level of REST endpoints, MCP tools, or admin UI — whatever
        fits.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Are there workarounds today? What did you try? Is there an
        existing plugin or external tool that partially covers this?

  - type: dropdown
    id: layer
    attributes:
      label: Which memory layer does this map to?
      description: |
        See GOVERNANCE.md → "five-table rule." Features that don't
        map to one of these are usually out of scope for core.
      options:
        - messages (raw log)
        - facts
        - decisions
        - session_summaries
        - cuts across multiple
        - none of these (likely out of scope)
    validations:
      required: true

  - type: textarea
    id: scope_check
    attributes:
      label: Why does this belong in core?
      description: |
        Could this be a separate plugin or downstream tool that uses
        the existing API? If yes, that is usually preferred. If no,
        explain what makes it core-only.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I read GOVERNANCE.md and the merge criteria.
          required: true
        - label: I searched existing issues and discussions for prior art.
          required: true
        - label: I understand that the maintainer may decline this for scope reasons.
          required: true
