[project]
name = "geshtu"
version = "0.1.0"
description = "Self-hosted shared memory for teams using LLMs"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Crowditory Ltd" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "numpy>=1.26",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "click>=8.1",
    "structlog>=24.1",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "respx>=0.21",
]

[project.scripts]
geshtu-migrate = "geshtu.migrate:main"
geshtu-bootstrap = "geshtu.bootstrap:main"
geshtu-export = "geshtu.cli_export:main"
geshtu-purge = "geshtu.cli_purge:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geshtu", "geshtu.db", "geshtu.routes"]
include-package-data = true

[tool.setuptools.package-data]
"geshtu.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
