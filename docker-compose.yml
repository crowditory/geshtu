name: geshtu

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geshtu}
      POSTGRES_USER: ${POSTGRES_USER:-geshtu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geshtu} -d ${POSTGRES_DB:-geshtu}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API and worker share one Docker image (./api) and only differ in
  # CMD. Sharing means embed.py / extract.py / models.py only get built
  # once and the BGE-M3 model cache is mountable into both. The API is on
  # `expose` not `ports`: it stays on the internal Docker network and is
  # reached only through admin / Caddy / mcp. If you need to curl it from
  # the host as a diagnostic, the simplest path is `docker compose exec
  # api curl localhost:8000/health`.
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geshtu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geshtu}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-haiku-4-5}
      DIGEST_MODEL: ${DIGEST_MODEL:-claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      MESSAGES_RETENTION_DAYS: ${MESSAGES_RETENTION_DAYS:-0}
      GESHTU_TELEMETRY: ${GESHTU_TELEMETRY:-off}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - modelcache:/app/.model_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./api
    restart: unless-stopped
    command: ["celery", "-A", "geshtu.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geshtu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geshtu}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-haiku-4-5}
      DIGEST_MODEL: ${DIGEST_MODEL:-claude-sonnet-4-6}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - modelcache:/app/.model_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The MCP server runs as a stdio process inside the user's MCP client
  # (Claude Desktop, Cursor, etc.) via `npx -y @geshtu/mcp`. There's no
  # value running it as a daemon here — there's no stdio peer to talk to.
  # We keep the build target so the image can be published and tested,
  # but it's behind the `mcp` profile so default `docker compose up` skips
  # it. To build/test only:  docker compose --profile mcp build mcp
  mcp:
    build:
      context: ./mcp
    profiles: ["mcp"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geshtu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geshtu}
      JWT_SECRET: ${JWT_SECRET}
      API_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # ADMIN_BIND controls who can reach the admin UI directly:
      #   - unset / 0.0.0.0 (default): public — fine for laptop dev or
      #     trusted private networks
      #   - 127.0.0.1: loopback only — set this when a TLS-terminating
      #     reverse proxy (Caddy) sits in front and exposes admin via HTTPS
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8501}:8501"

  # TLS terminator. Behind the `tls` profile so local-dev `docker compose up`
  # stays HTTP-only (no Let's Encrypt rate-limit risk while iterating).
  # Production:  docker compose --profile tls up -d
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env (e.g. geshtu.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  modelcache:
  caddydata:
  caddyconfig:
